<link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
<link rel="icon" type="image/png" href="{{ '/favicon.png' | relative_url }}" sizes="192x192">
<link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}">
<meta name="color-scheme" content="light dark">
<style>
  /* The site title link the theme adds above the content is replaced by the clickable logo. */
  .markdown-body > h1:first-child { display: none; }
  .markdown-body img { background-color: transparent; }

  html { scroll-behavior: smooth; }
  /* Button that jumps to the English version of the same page. */
  .markdown-body > .lang-jump { text-align: left; margin: 0 0 16px; }
  .lang-jump a { display: inline-block; padding: 6px 14px; border: 1px solid #d0d7de; border-radius: 6px;
    background-color: #f6f8fa; color: #24292e; font-weight: 600; text-decoration: none; }
  .lang-jump a:hover { background-color: #eaeef2; }

  @media (prefers-color-scheme: dark) {
    body { background-color: #0d1117; color: #e6edf3; }
    a { color: #58a6ff; }
    .lang-jump a { border-color: #30363d; background-color: #21262d; color: #e6edf3; }
    .lang-jump a:hover { background-color: #30363d; }
    .markdown-body h1, .markdown-body h2 { border-bottom-color: #30363d; }
    .markdown-body h6, .markdown-body blockquote { color: #8b949e; }
    .markdown-body blockquote { border-left-color: #30363d; }
    .markdown-body hr { background-color: #30363d; }
    .markdown-body code, .markdown-body tt { background-color: rgba(110, 118, 129, 0.4); }
    .markdown-body table th, .markdown-body table td { border-color: #30363d; }
    .markdown-body table tr { background-color: #0d1117; border-top-color: #30363d; }
    .markdown-body table tr:nth-child(2n) { background-color: #161b22; }
    /* The wordmark has dark navy parts; a thin light outline keeps them readable on a dark page. */
    .markdown-body img[alt="Back2Life"] { filter: drop-shadow(0 0 1px #fff) drop-shadow(0 0 1px #fff); }
  }
</style>
